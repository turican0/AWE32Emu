# Magic Carpet 2: The Netherworlds - initial state of the MIDI channels
#
# The game runs through Miles/AIL (AIL V3.02 of 18 Jan 1995) and its MDI
# driver `SOUND\SBAWE32.MDI` gets this sequence of messages on **all sixteen
# channels** at start-up. Without it our render starts from other defaults
# (mainly CC7 100 instead of 127 and CC91 0 instead of 40) and cannot match
# the game.
#
# Source: `NETHERW.EXE`, initialisation of the MDI driver. Decompiled in
# remc2 (`engine/Sound.cpp`, the loop `for (i = 0; i < 16; i++)` with
# `sub_A4F10`). Two values come from the AIL preference array
# `preference_181DAC`: CC7 from index 13 (0x7F) and CC6 from index 16.
#
# Lines are read top to bottom and sent in that order, because it matters:
# CC100/CC101 must precede CC6, otherwise the bend range would go nowhere.
#
# XMIDI master volume. The game sets it through AilSetXMidiMasterVolume and
# the driver scales every channel's CC7 with it (cc7 * master / 127). Sending
# it as CC7 at the start is not enough - the XMI overwrites its own CC7 at
# once.
#
# Measured against a trace from the game: without it the driver has 10 units
# of attenuation (3.75 dB) more than we do on every note, with it IFATN
# matches on 259 of 261 notes.
# NOTE: it is not a fixed value. The intro plays at 100, the menu music at
# 127 (measured; with each, the corresponding part matches on all 24
# registers). The game changes the master volume depending on the situation,
# so for another part use the switch --master-volume, which overrides this
# value.
master_volume 100

# The game's trigger callback on XMIDI CC119 (NETHERW sub_8E0D0): value 0
# sends CC11 = 0 on the same channel - the "war" tracks of the level music
# stay silent until a fight raises them. In the recording of level 1,
# channels 7-9 are indeed absent.
trigger_mute 1

# Format:
#   cc <number> <value>    control change (0xB0)
#   program <number>       program change (0xC0)
#   bend <value>           pitch bend, 0..16383, centre 8192 (0xE0)
#   master_volume <0..127> XMIDI master volume (see above)
#   trigger_mute <0|1>     CC119 trigger callback (see above)
# Everything after '#' is a comment.

cc 114 0
program 0
bend 8192
cc 112 0
cc 1 0

# channel volume - AIL preference 13
cc 7 127

cc 10 64
cc 11 127
cc 64 0

# Reverb. The remc2 decompilation has 40 here, but **measured against the
# game's trace it is 0**: on the channels that do not set CC91 in the XMI
# (2, 5, 6) the driver has a zero channel share - on 26 notes of ch2 the
# patch came out 0 instead of our 36 and on ch5 28 instead of 64. With zero,
# PTRX matches 261/261. So the 40 never reaches the device; AIL overwrites
# the channel state from its own shadow copy when the sequence starts.
cc 91 0

cc 93 0

# pitch bend range through RPN 0,0 - 12 semitones, as the game's driver
# trace shows (see Synth.cpp, RPN handling)
cc 100 0
cc 101 0
cc 38 0
cc 6 12
