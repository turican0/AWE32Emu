name: release

# Builds the Windows and Linux binaries whenever a tag starting with "v" is
# pushed (e.g. v0.3, v1.0.2) and attaches them to a GitHub release.
#
# The build goes through CMakeLists.txt in the repository root, not the .sln,
# so that Linux builds too. Included: both chip cores (our own and the 86Box
# one, `--chip 86box`), RtAudio for live playback and, on Linux, the message
# translations (locale/).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # can also be started by hand, as a dry run

permissions:
  contents: write           # needed to create the release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            exe: AWE32Emu.exe
          - os: ubuntu-latest
            name: linux-x64
            exe: AWE32Emu

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev gettext

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # The install step collects the binary and, where built, locale/.
      - name: Collect
        shell: bash
        run: |
          cmake --install build --config Release --prefix dist
          mkdir -p dist/docs
          cp README.md dist/
          cp docs/USAGE.md docs/TESTING.md dist/docs/
          cp AWE32Emu/src/86box/README.md dist/docs/86box-core.md

      - name: Smoke test
        shell: bash
        run: ./dist/${{ matrix.exe }} --help

      - uses: actions/upload-artifact@v4
        with:
          name: AWE32Emu-${{ github.ref_name }}-${{ matrix.name }}
          path: dist/

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Artifacts lose the executable bit on the way, so it is set again
      # before packing. Linux gets a .tar.gz, which keeps it for the user.
      - name: Pack
        run: |
          cd artifacts
          for d in */; do
            n="${d%/}"
            if [ -f "$n/AWE32Emu" ]; then
              chmod +x "$n/AWE32Emu"
              tar -czf "$n.tar.gz" -C "$n" .
            else
              (cd "$n" && zip -r "../$n.zip" .)
            fi
          done
          ls -la

      # A new tag gets a release with generated notes. When the release
      # already exists (the workflow ran again for the same tag), only the
      # files are replaced - generating the notes again would append them to
      # the text a second time.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          files=(artifacts/*.zip artifacts/*.tar.gz)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${files[@]}" --generate-notes --verify-tag \
                --title "$TAG" --repo "$GITHUB_REPOSITORY"
          fi
